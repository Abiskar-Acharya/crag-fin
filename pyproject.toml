[tool.poetry]
name = "crag-fin"
version = "0.1.0"
description = "Calibrated, source-aware, agentic verifier for financial misinformation"
authors = ["Abiskar Acharya <abiskaracharya1@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "crag_fin", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"

# Core ML
torch = ">=2.2"
transformers = ">=4.40"
sentence-transformers = ">=3.0"
scikit-learn = ">=1.4"
numpy = ">=1.26"
pandas = ">=2.2"

# Retrieval stack
chromadb = ">=0.5"
rank-bm25 = ">=0.2"

# LLM clients
ollama = ">=0.3"
openai = ">=1.30"          # used for OpenAI / DeepSeek / OpenRouter compatible endpoints

# Web tools
tavily-python = ">=0.3"
requests = ">=2.32"
beautifulsoup4 = ">=4.12"

# Calibration
mapie = ">=0.8"

# Eval
ragas = ">=0.2"

# Stats and viz
scipy = ">=1.13"
statsmodels = ">=0.14"
matplotlib = ">=3.9"
seaborn = ">=0.13"

# Serving
fastapi = ">=0.111"
uvicorn = ">=0.30"
pydantic = ">=2.7"

# Config
pyyaml = ">=6.0"
python-dotenv = ">=1.0"

# Structured LLM output
outlines = ">=0.0.45"
feedparser = "^6.0.12"
tldextract = "^5.3.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2"
pytest-cov = ">=5.0"
ruff = ">=0.4"
mypy = ">=1.10"
ipykernel = ">=6.29"
jupyter = ">=1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=crag_fin --cov-report=term-missing"
